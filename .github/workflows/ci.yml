name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test/host -B build-host
      - name: Build
        run: cmake --build build-host
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build for esp32s3
        shell: bash
        run: |
          set -eo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build 2>&1 | tee build.log
      - name: Fail on warnings from main/
        shell: bash
        run: |
          # compiler lines look like /__w/<repo>/<repo>/main/foo.c:12:3: warning: ...
          if grep -E "^(${GITHUB_WORKSPACE}/)?main/[^ :]+:[0-9]+(:[0-9]+)?: warning:" build.log; then
            echo "::error::warnings in main/ (listed above)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# One repo, two boards: the display project at the root, the IO node in CarHvacIoNode/.
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project: [".", "CarHvacIoNode"]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S test/host -B build-host
      - name: Build
        run: cmake --build build-host
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  shared-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Files both boards compile must be byte-identical
        run: |
          for f in cobs_protocol.h ota_image.h ota_image.c; do
            cmp "main/$f" "CarHvacIoNode/main/$f"
          done

  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      matrix:
        include:
          - project: "."
            name: display
          - project: "CarHvacIoNode"
            name: node
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # tags: each project takes its version from its own tags
      - name: Build for esp32s3
        shell: bash
        run: |
          set -eo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build 2>&1 | tee build.log
      - name: Fail on warnings from main/
        shell: bash
        run: |
          # compiler lines look like /__w/<repo>/<repo>/[CarHvacIoNode/]main/foo.c:12:3: warning: ...
          if grep -E "^(${GITHUB_WORKSPACE}/)?(CarHvacIoNode/)?main/[^ :]+:[0-9]+(:[0-9]+)?: warning:" build.log; then
            echo "::error::warnings in main/ (listed above)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.name }}
          path: |
            ${{ matrix.project }}/build/*.bin
            ${{ matrix.project }}/build/bootloader/bootloader.bin
            ${{ matrix.project }}/build/partition_table/partition-table.bin
          if-no-files-found: error
